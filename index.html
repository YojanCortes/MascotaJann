<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Best Practices -->
    <title>Descargar App - MascotaJann</title>
    <meta name="description" content="Descarga la última versión de la aplicación. Escanea el código QR o haz clic en el botón para comenzar la instalación.">
    
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg-dark: #0f172a;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            /* Animated gradient background */
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-light);
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            padding: 3rem 2.5rem;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        
        /* Subtle glow effect behind card */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .glass-card:hover {
            transform: translateY(-8px);
        }

        .app-logo {
            width: 110px;
            height: 110px;
            border-radius: 28px;
            margin: 0 auto 1.5rem;
            display: block;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            object-fit: cover;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255,255,255,0.1);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #ffffff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 1.2rem;
            border-radius: 24px;
            display: inline-block;
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .qr-wrapper:hover {
            transform: scale(1.05);
        }

        .qr-wrapper img {
            display: block;
            width: 180px;
            height: 180px;
            border-radius: 8px;
        }
        
        .qr-hint {
            position: absolute;
            bottom: -30px;
            left: 0;
            right: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 1.1rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
            width: 100%;
        }

        .download-btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.6);
            transform: translateY(-2px);
        }
        
        .download-btn i {
            font-size: 1.3rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-4px); }
            60% { transform: translateY(-2px); }
        }
        
        /* Floating particles effect */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 10s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    
    <!-- Background particles for rich aesthetics -->
    <div class="particles" id="particles"></div>

    <main class="glass-card">
        <!-- REEMPLAZA ESTA URL CON LA RUTA DE TU LOGO -->
        <img src="https://via.placeholder.com/150/1e293b/8b5cf6?text=LOGO" alt="Logo de la App" class="app-logo" id="appLogo">
        
        <h1 id="appTitle">MascotaJann</h1>
        <p class="subtitle">Escanea el código QR desde tu celular para acceder a esta página y descargar la aplicación.</p>

        <div class="qr-wrapper">
            <img id="qr-code" src="" alt="Código QR para descargar la app">
            <span class="qr-hint">Apunta la cámara aquí</span>
        </div>

        <!-- ESTE LINK AHORA APUNTA A TU RELEASE v1.0.1 -->
        <a href="https://github.com/YojanCortes/MascotaJann/releases/download/v1.0.1/app-release.apk" class="download-btn" id="downloadBtn">
            <i class="fa-solid fa-cloud-arrow-down"></i>
            Descargar APK
        </a>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Genera el QR dinámicamente con la URL actual de la página.
            // Si subes esto a GitHub Pages, el QR automáticamente apuntará a la página de GitHub Pages.
            const qrImage = document.getElementById("qr-code");
            const currentUrl = encodeURIComponent(window.location.href);
            qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${currentUrl}&color=0f172a&bgcolor=ffffff&margin=10`;

            // Partículas flotantes en el fondo
            const particlesContainer = document.getElementById('particles');
            for(let i = 0; i < 20; i++) {
                let particle = document.createElement('div');
                particle.className = 'particle';
                let size = Math.random() * 15 + 5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particlesContainer.appendChild(particle);
            }
        });
    </script>
</body>
</html>
